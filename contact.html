<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rezniqi — Contact Us</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo">Rezniqi</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
      <a href="products.html">Products</a>
      <a href="contact.html" class="active">Contact Us</a>
    </nav>
    <button class="menu-toggle" onclick="document.querySelector('nav').classList.toggle('open')">&#9776;</button>
  </header>

  <section class="page-hero">
    <h1>Contact Us</h1>
    <p>We'd love to hear from you. Reach out anytime.</p>
  </section>

  <section class="contact-section">
    <div class="contact-info">
      <div class="contact-item">
        <h4>Address</h4>
        <p>Prishtina, Kosovo</p>
      </div>
      <div class="contact-item">
        <h4>Email</h4>
        <p>info@rezniqi.net</p>
      </div>
      <div class="contact-item">
        <h4>Phone</h4>
        <p>+383 00 000 000</p>
      </div>
      <div class="contact-item">
        <h4>Hours</h4>
        <p>Mon–Fri: 9:00 – 18:00</p>
      </div>
    </div>

    <form class="contact-form" onsubmit="return false;">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Your name">
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="your@email.com">
      </div>
      <div class="form-group">
        <label for="subject">Subject</label>
        <input type="text" id="subject" placeholder="What is this about?">
      </div>
      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" rows="5" placeholder="Write your message here..."></textarea>
      </div>
      <button type="submit" class="btn">Send Message</button>
    </form>
  </section>

  <footer>
    <p>&copy; 2026 Rezniqi. All rights reserved.</p>
  </footer>
</body>
</html>
